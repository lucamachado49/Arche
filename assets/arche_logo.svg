<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Arche — robô</title>

  <!-- ===================== ROBÔ ===================== -->
  <g transform="translate(14,6)">
    <!-- antena + nó sensor (âmbar = detecta o sinal) -->
    <line x1="90" y1="50" x2="90" y2="26" stroke="#1E2A4A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="90" cy="20" r="7" fill="#E39A2B"/>

    <!-- orelhas / módulos laterais -->
    <rect x="12"  y="94" width="14" height="34" rx="7" fill="#1E2A4A"/>
    <rect x="154" y="94" width="14" height="34" rx="7" fill="#1E2A4A"/>

    <!-- cabeça -->
    <rect x="26" y="50" width="128" height="122" rx="30" fill="#1E2A4A"/>

    <!-- visor -->
    <rect x="44" y="76" width="92" height="74" rx="22" fill="#141D33"/>

    <!-- olhos = dois nós da rede -->
    <circle cx="70"  cy="106" r="12" fill="#F4F1E8"/>
    <circle cx="110" cy="106" r="12" fill="#F4F1E8"/>
    <!-- o olho que "vê" a anomalia: pupila âmbar -->
    <circle cx="110" cy="106" r="5.5" fill="#E39A2B"/>
    <circle cx="70"  cy="106" r="5.5" fill="#141D33"/>

    <!-- a curvatura tornada visível: geodésica âmbar entre os dois nós -->
    <circle cx="66" cy="132" r="3.5" fill="#E39A2B"/>
    <circle cx="114" cy="132" r="3.5" fill="#E39A2B"/>
    <path d="M66,132 Q90,156 114,132" fill="none" stroke="#E39A2B" stroke-width="4.5" stroke-linecap="round"/>

    <!-- pescoço / base -->
    <rect x="74" y="172" width="32" height="12" rx="4" fill="#1E2A4A"/>
    <rect x="52" y="184" width="76" height="10" rx="5" fill="#1E2A4A" fill-opacity="0.5"/>
  </g>

  <!-- ===================== LOGOTIPO ===================== -->
  <g transform="translate(212,0)">
    <text x="0" y="112" font-size="74" font-weight="600" letter-spacing="13" fill="#1E2A4A">ARCHE</text>
    <line x1="4" y1="140" x2="356" y2="140" stroke="#1E2A4A" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="4" cy="140" r="3" fill="#E39A2B"/>
    <text x="20" y="168" font-size="15.5" font-weight="500" letter-spacing="6" fill="#1E2A4A" fill-opacity="0.7">ANTES DO PREÇO, A GEOMETRIA</text>
  </g>
</svg>
