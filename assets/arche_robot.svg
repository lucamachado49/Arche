<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" font-family="'Cinzel', 'Times New Roman', serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#C9A15A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C9A15A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo obsidiana -->
  <rect width="560" height="600" fill="#0B0D10"/>
  <ellipse cx="280" cy="250" rx="230" ry="230" fill="url(#glow)"/>

  <!-- geometria sagrada: círculos concêntricos -->
  <circle cx="280" cy="250" r="168" fill="none" stroke="#C9A15A" stroke-opacity="0.30" stroke-width="1"/>
  <circle cx="280" cy="250" r="120" fill="none" stroke="#C9A15A" stroke-opacity="0.14" stroke-width="1"/>

  <!-- partículas: o caos convergindo (ordem a partir da desordem) -->
  <g fill="#C9A15A">
    <circle cx="16"  cy="298" r="1"   opacity="0.15"/><circle cx="30" cy="284" r="1.2" opacity="0.18"/>
    <circle cx="26"  cy="322" r="1"   opacity="0.15"/><circle cx="46" cy="300" r="1.3" opacity="0.22"/>
    <circle cx="42"  cy="270" r="1"   opacity="0.2"/> <circle cx="60" cy="312" r="1.3" opacity="0.25"/>
    <circle cx="66"  cy="288" r="1.5" opacity="0.28"/><circle cx="56" cy="340" r="1"   opacity="0.2"/>
    <circle cx="80"  cy="300" r="1.6" opacity="0.3"/> <circle cx="84" cy="276" r="1.3" opacity="0.3"/>
    <circle cx="74"  cy="326" r="1.2" opacity="0.28"/><circle cx="98" cy="308" r="1.7" opacity="0.35"/>
    <circle cx="104" cy="284" r="1.4" opacity="0.35"/><circle cx="94" cy="330" r="1.3" opacity="0.32"/>
    <circle cx="118" cy="300" r="1.8" opacity="0.42"/><circle cx="124" cy="282" r="1.5" opacity="0.44"/>
    <circle cx="112" cy="322" r="1.4" opacity="0.4"/> <circle cx="138" cy="296" r="1.9" opacity="0.5"/>
    <circle cx="146" cy="312" r="1.6" opacity="0.5"/> <circle cx="156" cy="286" r="1.7" opacity="0.55"/>
    <circle cx="170" cy="300" r="2"   opacity="0.62"/><circle cx="184" cy="292" r="2"   opacity="0.72"/>
  </g>

  <!-- ================= ROBÔ (linha dourada) ================= -->
  <g stroke="#C9A15A" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- antena / ápice — a convergência no primeiro princípio -->
    <line x1="280" y1="150" x2="280" y2="112" stroke-width="2"/>
    <path d="M280,100 L288,112 L280,124 L272,112 Z" fill="#C9A15A" stroke="none"/>

    <!-- linhas convergindo do ápice para dentro da cabeça (o "A") -->
    <g stroke-width="1" stroke-opacity="0.45">
      <line x1="280" y1="116" x2="236" y2="158"/>
      <line x1="280" y1="116" x2="324" y2="158"/>
      <line x1="280" y1="116" x2="280" y2="158"/>
    </g>

    <!-- módulos laterais -->
    <rect x="192" y="212" width="12" height="42" rx="6" stroke-width="1.5"/>
    <rect x="356" y="212" width="12" height="42" rx="6" stroke-width="1.5"/>

    <!-- cabeça -->
    <rect x="206" y="152" width="148" height="150" rx="34" fill="#0E1116" stroke-width="2"/>

    <!-- visor -->
    <rect x="228" y="188" width="104" height="86" rx="22" fill="#0B0D10" stroke-width="1" stroke-opacity="0.55"/>

    <!-- olhos = dois nós; o direito "aceso" vê a anomalia -->
    <circle cx="256" cy="224" r="13" fill="#0E1116" stroke-width="2.4"/>
    <circle cx="304" cy="224" r="17" fill="none" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="304" cy="224" r="10" fill="#C9A15A" stroke="none"/>

    <!-- a curvatura tornada visível: geodésica âmbar entre os nós -->
    <circle cx="256" cy="256" r="3.5" fill="#C9A15A" stroke="none"/>
    <circle cx="304" cy="256" r="3.5" fill="#C9A15A" stroke="none"/>
    <path d="M256,256 Q280,282 304,256" stroke-width="3"/>

    <!-- pescoço / base + prumo (eixo do primeiro princípio) -->
    <line x1="280" y1="302" x2="280" y2="322" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="262" y="302" width="36" height="12" rx="4" fill="#0E1116" stroke-width="1.5"/>
    <circle cx="280" cy="330" r="3" fill="#C9A15A" stroke="none"/>
  </g>

  <!-- ================= LOGOTIPO ================= -->
  <g text-anchor="middle">
    <line x1="230" y1="392" x2="330" y2="392" stroke="#C9A15A" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="280" cy="392" r="2.5" fill="#C9A15A"/>
    <text x="284" y="438" font-size="46" letter-spacing="16" fill="#F2EFE6">ARCHE</text>
    <text x="282" y="470" font-size="11.5" letter-spacing="5" fill="#C9A15A" fill-opacity="0.85"
          font-family="'Inter', Arial, sans-serif">ARCHITECTING ORDER FROM DISORDER</text>
  </g>
</svg>
