# ═══════════════════════════════════════════════════════════════
# ARCHE — Configurações Centrais do Modelo
# Todos os parâmetros do pipeline ficam aqui.
# Nunca hardcode valores no código — sempre referencie este arquivo.
# ═══════════════════════════════════════════════════════════════

# ─── Universo de Ativos ────────────────────────────────────────
universe:
  min_daily_volume_brl: 5_000_000      # filtro de liquidez: R$ 5M/dia mínimo
  min_history_days: 252                # mínimo de dias para incluir ativo no universo
  volume_lookback_days: 63             # janela para calcular volume médio (~3 meses)
  start_date: "2012-01-01"            # início do histórico completo
  end_date: "2024-12-31"              # fim do histórico (out-of-sample termina aqui)

# ─── Grafo / MST ───────────────────────────────────────────────
graph:
  correlation_window_days: 60         # janela rolante para calcular correlações
  correlation_min_periods: 40         # mínimo de observações válidas na janela
  distance_metric: "sqrt_2_minus_corr"  # d(i,j) = √(2(1-ρ))
  mst_extra_threshold: 0.55          # ξ — adiciona arestas com ρ > threshold além da MST
  markov_alpha: 0.5                   # peso do self-loop nas distribuições de Markov
                                      # 0 = sem self-loop, 1 = só self-loop

# ─── Curvatura ─────────────────────────────────────────────────
curvature:
  # Ollivier-Ricci
  wasserstein_solver: "emd"          # "emd" (exato) ou "sinkhorn" (rápido, aproximado)
  sinkhorn_reg: 0.1                  # regularização Sinkhorn (só se solver="sinkhorn")
  max_lp_time_seconds: 30            # timeout por LP — se exceder, usa Sinkhorn
  # Nodal (GDS)
  kappa_history_days: 252            # janela para calcular σᵢ do histórico de κᵢ
  gds_threshold_sigma: 2.0          # z — limiar de Δκᵢ para gerar sinal (±z·σᵢ)
  # Ricci Flow (Fase 2)
  flow_steps: 50
  flow_dt: 0.01

# ─── Sinal / IC ────────────────────────────────────────────────
signal:
  ic_horizons: [1, 5, 10, 21]        # horizontes para calcular IC (dias úteis)
  # Critérios make-or-break (pré-definidos ANTES de ver os dados)
  ic_min_mean: 0.03                  # IC médio mínimo em pelo menos 2 horizontes
  ic_min_ir: 0.30                    # IC_IR (IC / std(IC)) mínimo
  ic_min_pct_positive: 0.55         # % de períodos com IC > 0
  # Convenção de sinal — ÚNICA fonte de verdade do lado do book.
  #   alpha_score = signal_sign · GDS   (maior score ⇒ candidato a LONG)
  # O IC cross-seccional realizado é IC(GDS, retorno_futuro) = +0.047 em
  # BR h=21 (t_NW=4.74, p_perm=0.001): GDS ALTO prevê retorno ALTO. Logo,
  # para ficar consistente com os dados, long no GDS alto ⇒ signal_sign=+1.
  # (A tese original de "reversão" — long no GDS baixo — é signal_sign=-1 e
  #  é rejeitada pelo sinal do IC. Trave este valor ANTES de ver o OOS.)
  signal_sign: 1
  # Suavização EWMA (causal) do GDS antes de rankear, em nº de períodos da
  # grade do sinal (semanal). O Δκ de 1 semana é dominado por rewiring da
  # MST; o alpha de curvatura é LENTO (~1 trimestre). Suavizar ~quase dobra
  # o Sharpe bruto (0.23→0.48) e o platô 12–26 é robusto. 20 ≈ 1 trimestre,
  # consistente com h*=21d. span=1 desliga. Ver scripts/diag_tier1.
  gds_smoothing_span: 20

# ─── Portfólio ─────────────────────────────────────────────────
portfolio:
  n_quantiles: 5                     # número de quintis
  # Reamostragem do rebalanceamento. O GDS é estimado semanalmente (mais
  # dados p/ σ), mas o sinal só tem poder preditivo em h≈21 (mensal) — os
  # horizontes h=1,5,10 são nulos. Negociar semanalmente paga custo p/
  # perseguir ruído (turnover ~4× inflado). Rebalance mensal casa o trade
  # com o horizonte do alpha. Ver WalkForwardBacktest._subsample_rebalance.
  rebalance_frequency: "monthly"     # "daily" | "weekly" | "monthly"
  max_weight_single_asset: 0.15      # peso máximo por ativo (diversificação)
  long_short_ratio: 1.0              # 1.0 = market-neutral
  # Construção de pesos (decidido por diagnóstico controlado — scripts/diag_tier1):
  #   "quintile" — long/short nos quintis extremos do score. VENCEDOR: o alpha
  #                 do GDS é concentrado nas CAUDAS. Espalhar peso pelo
  #                 cross-section ("zscore") ou rotacionar por risco ("mv")
  #                 DESTRÓI o sinal bruto (Sharpe vira negativo) — a Σ de 60d
  #                 é ruído demais e carrega onde o GDS é fraco.
  #   "zscore"   — peso ∝ z-score do alpha em todo o cross-section (rejeitado)
  #   "mv"       — mean-variance w ∝ Σ⁻¹·α via Ledoit-Wolf (rejeitado p/ este
  #                 sinal; mantido como opção p/ sinais futuros mais densos)
  construction_method: "quintile"
  # Banda de no-trade (unidades de peso). INERTE para este sinal: o turnover
  # vem de nomes rotacionando a cauda inteira, não de micro-oscilações — a
  # banda não morde. Mantida no código p/ sinais mais persistentes. Ver
  # scripts/diag_tier1 e o gargalo de custo/turnover do engine.
  no_trade_band: 0.0
  # Hysteresis no ranking (entra no top `entry_quantile`, só sai abaixo do top
  # `exit_quantile`, mais largo). TESTADA E REJEITADA p/ este sinal: corta
  # turnover (1.34→1.11) mas derruba o bruto (0.49→0.17) — segurar nome
  # obsoleto na cauda destrói o alpha LENTO mais rápido do que economiza
  # custo. exit=entry desliga (quintil puro = vencedor). Ver scripts/diag_tier1.
  entry_quantile: 0.20               # = 1/n_quantiles (cauda de entrada)
  exit_quantile: 0.20                # = entry ⇒ hysteresis desligada

# ─── Custos de Transação (diferenciados por grupo) ─────────────
costs:
  large_caps:                        # VALE, PETR, ITUB, BBDC, ABEV, etc.
    tickers: ["VALE3", "PETR4", "ITUB4", "BBDC4", "ABEV3",
              "WEGE3", "RENT3", "BBAS3", "SUZB3", "ELET3"]
    commission_bps: 8
    spread_bps: 5
  mid_caps:                          # restante do Ibovespa
    commission_bps: 10
    spread_bps: 12
  small_liquid:                      # fora do Ibovespa, volume > R$5M
    commission_bps: 12
    spread_bps: 20
  short_borrow_annual_pct: 3.0      # custo de aluguel médio B3

# ─── Backtest Walk-Forward ─────────────────────────────────────
backtest:
  train_years: 3
  test_months: 6
  step_months: 3                     # avanço da janela a cada iteração
  in_sample_end: "2018-12-31"       # última data do treino inicial
  out_of_sample_start: "2019-01-01" # início do teste out-of-sample

# ─── Transfer Learning (S&P 500 → Ibovespa) ───────────────────
# Fase 2: usa o S&P como amostra de REPLICAÇÃO da lei GDS→retorno.
# A geometria é SEMPRE calculada dentro de cada mercado (nunca se
# mistura ativo BR e US no mesmo grafo). O que transfere é a lei
# adimensional, não a curvatura bruta. Ver src/transfer/.
transfer:
  discovery_market: "US"             # mercado de calibração (alto poder)
  confirm_market: "BR"               # mercado de confirmação out-of-sample
  sp500_max_tickers: 200             # top-N por liquidez (200 já triplica o cross-section
                                     # do Ibov e mantém a curvatura computável)
  sp500_tickers_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  non_overlapping: true              # amostra datas espaçadas ≥ h dias úteis
                                     # (evita autocorrelação por retornos sobrepostos)
  ic_horizons: [1, 5, 10, 21]        # horizontes testados (dias úteis)
  permutation_n: 1000                # permutações no teste estratificado
  min_names_per_date: 5              # mínimo de ativos para um IC cross-seccional válido

# ─── Validação ─────────────────────────────────────────────────
validation:
  ff_factors: ["Rm_minus_Rf", "SMB", "HML", "WML"]
  alpha_min_tstat: 2.0              # t-stat mínimo para alpha ser significativo
  granger_max_pvalue: 0.05         # p-value máximo para causalidade de Granger
  granger_max_lags: 10              # lags testados no teste de Granger
  permutation_n: 1000              # número de permutações no permutation test
  concordance_min_corr: 0.6        # correlação mínima Ollivier vs Forman

# ─── Infraestrutura ────────────────────────────────────────────
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_cache: "data/cache"
  reports: "reports"

logging:
  level: "INFO"                      # DEBUG | INFO | WARNING | ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {module}:{function}:{line} | {message}"
  file: "logs/arche.log"
  rotation: "10 MB"
